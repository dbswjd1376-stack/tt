<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML05</title>

    <style>
td {
    text-align: center;
    color: rgb(134, 90, 211);
}
    </style>



</head>
<body>
    

<table border="1" width="300px" height="300px">
    <tr>
        <th>음식</th>
        <th>장소</th>
    </tr>
    <tr>
        <td>치킨</td>
        <td>동대문</td>
    </tr>
    <tr>
        <td>부대찌개</td>
        <td>혜화</td>
    </tr>
</table>


<table border="1" width="300px" height="300">
 <tr>
    <td colspan="2">1</td>
    <td rowspan="2">2</td>
 </tr>
 <tr>
    <td>3</td>
    <td>4</td>
 </tr>

</table>

<table border="1" width="300px" height="300">
 <tr>
    <td colspan="2">1</td>
    <td rowspan="2">2</td>
   
 </tr>
 <tr>
    <td rowspan="2">4</td>
    <td>5</td>
    
 </tr>
 
 <tr>
    <td colspan="2">7</td>
    
    
 </tr>

</table>






</body>
</html>
